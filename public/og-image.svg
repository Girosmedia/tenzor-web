<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05070A"/>
      <stop offset="100%" style="stop-color:#0B1318"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22F1D1"/>
      <stop offset="100%" style="stop-color:#B9FF66"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="#24363D" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#24363D" stroke-width="1"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#24363D" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#24363D" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#24363D" stroke-width="1"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke="#24363D" stroke-width="1"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke="#24363D" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="#24363D" stroke-width="1"/>
  </g>

  <!-- Accent line top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Logo mark -->
  <g transform="translate(600, 210)">
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
    <path d="M-30 -20h60L-4 30M35 -20 5.5 30h-40" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" fill="none"/>
  </g>

  <!-- Brand name -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#FFF4DF" text-anchor="middle" letter-spacing="-1">TENZOR LABS</text>

  <!-- Subtitle -->
  <text x="600" y="400" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" fill="#9BAAA6" text-anchor="middle" letter-spacing="4">SOFTWARE PARA PYMES CHILENAS</text>

  <!-- Bottom accent line -->
  <rect x="400" y="480" width="400" height="2" fill="#24363D"/>

  <!-- URL -->
  <text x="600" y="530" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" fill="#657470" text-anchor="middle">tenzorlabs.cl</text>
</svg>
